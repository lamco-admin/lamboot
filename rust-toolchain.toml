[toolchain]
# Stable: lamboot-core + diagnostic modules + both UEFI arches build on stable
# rustc (zero nightly feature gates). The nightly pin was unnecessary baggage,
# and stable-buildability is a prerequisite for any from-source Debian build
# (Debian's archive rustc is stable). Verified 2026-06-04 on rustc 1.96.0.
channel = "stable"
targets = ["x86_64-unknown-uefi", "aarch64-unknown-uefi"]
