[package]
name = "lamboot-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
uefi.workspace = true
uefi-raw.workspace = true
log.workspace = true
# SDS-2: native read-only ext4 backend. Exact-pinned per SDS-2 §11.1 —
# ext4-view made Incompatible opaque in 0.9.0 and we match on it; unpinned
# semver would risk silent behavioral drift. Upgrade procedure in §11.2.
# `default-features` is empty upstream so `false` is belt-and-suspenders.
ext4-view = { version = "=0.9.3", default-features = false }

# Path A (native btrfs read backend): lambutter is the Lamco-authored
# no_std read-only btrfs reader, mirror of ext4-view's role for ext4.
# Published to crates.io as `lambutter`; exact-pinned per SDS-2 §11.2 so a
# lambutter minor bump is a deliberate lamboot change, not silent drift
# (same discipline as ext4-view). Features: enable all three compression
# backends (zstd default + zlib + lzo) so any distro's btrfs /boot is
# readable regardless of compress=… mount opt.
lambutter = { version = "=0.3.0", default-features = false, features = ["zstd", "zlib", "lzo"] }

# lamlvm: Lamco-authored no_std read-only LVM2 PV/VG/LV parser. Vendored +
# modernized fork of main--/rust-lvm2 (MIT). Used by `fs_backend_lvm` to
# read kernels from Linux roots that live on a logical volume — primarily
# Proxmox VE hosts (which install pve-root as a linear LV on a single PV).
# Published to crates.io as `lamlvm`. Exact-pinned per SDS-2 §11.2 so a lamlvm
# minor bump is a deliberate lamboot change, not silent drift (same discipline
# as ext4-view above).
lamlvm = { version = "=0.1.0", default-features = false }

# embedded-io: required to bridge UEFI BlockIO into the no_std `Read + Seek`
# trait surface that lamlvm consumes. Same version line lamlvm pins.
embedded-io = { version = "0.6", default-features = false, features = ["alloc"] }

# FatRo: native read-only FAT reader for non-ESP FAT volumes the firmware
# refuses to serve (separate vfat /boot on OVMF/i440FX — root cause memory
# obs 4d6f6a9a). Pinned to a git rev: the no_std IoBase/Read/Write/Seek
# surface only exists on the unpublished 0.4.0 master line; crates.io 0.3.6 is
# std/core_io-based. RO-by-construction — consumed only through `FsBackend`
# (read surface); `BackendTag::FatRo` is rejected by `EspWriter::new`, so the
# native FAT path has no constructible write surface. Features: `alloc`
# (LamBoot is alloc) + `lfn` (so `vmlinuz-*` long names resolve); `unicode`
# omitted (kernel/initrd names are ASCII) to keep the signed binary smaller.
# Vendoring + supply-chain audit is the productionization follow-up.
fatfs = { git = "https://github.com/rafalh/rust-fatfs", rev = "c4b88477b22ca7e5131fbd8891f62a5deaa88e6e", default-features = false, features = ["alloc", "lfn"] }

# SDS-3: native PE loader. Exact-pinned per spec §11 version-pinning
# policy. `pe64` enables 64-bit PE parsing (the only format we support
# per spec §5.1); `endian_fd` enables scroll-based endian-aware parsing.
# Default features pull in `std` — disable.
goblin = { version = "=0.10.5", default-features = false, features = ["pe64", "endian_fd"] }

# SDS-3: SHA-256 for trust-log `image_loaded_native` events. Pure
# software — `asm` feature requires nightly + arch-specific assembly,
# keep off. Default features pull in `std`; disable.
sha2 = { version = "=0.10.8", default-features = false }

[lints]
workspace = true

[[bin]]
name = "lambootx64"
path = "src/main.rs"
